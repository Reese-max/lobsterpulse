name: Release

# Tag-triggered release: builds all 3 platforms, zips the two binaries
# (lobster-pulse + lobster-pulse-hook sidecar), and attaches each platform's
# zip to a GitHub Release. The Release is created as a draft so you can
# review and publish manually.
#
# Only after owner approval, trigger by pushing a tag matching the app version:
#   git tag v<app-version>
#   git push origin v<app-version>
#
# A tag must match the Cargo/Tauri/package/docs version. Branch dispatch is
# intentionally disabled so it cannot create a draft with a branch-name tag.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux
            rust-target: ""
          # Both macOS builds run on the Apple-Silicon runner (macos-latest);
          # macos-13 was retired by GitHub. We cross-compile x86_64 from arm64
          # using rustup + Xcode's bundled SDK.
          - platform: macos-latest
            name: macos-arm64
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            name: macos-x64
            rust-target: x86_64-apple-darwin
          - platform: windows-latest
            name: windows
            rust-target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify release version and regression checks
        run: |
          python scripts/release_contract.py --tag "${{ github.ref_name }}"
          python scripts/test_release_contract.py

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add rust target
        if: matrix.rust-target != ''
        run: rustup target add ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust-target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall -y tauri-cli@^2.0

      - name: Build (no bundle)
        shell: bash
        run: |
          if [[ -n "${{ matrix.rust-target }}" ]]; then
            cargo tauri build --target ${{ matrix.rust-target }} --no-bundle
          else
            cargo tauri build --no-bundle
          fi

      - name: Package and verify portable archive
        shell: bash
        run: |
          if [[ -n "${{ matrix.rust-target }}" ]]; then
            BUILD_DIR="src-tauri/target/${{ matrix.rust-target }}/release"
          else
            BUILD_DIR="src-tauri/target/release"
          fi
          python scripts/release_contract.py \
            --tag "${{ github.ref_name }}" \
            --platform "${{ matrix.name }}" \
            --build-dir "$BUILD_DIR" \
            --output-dir "$GITHUB_WORKSPACE"

      # Extract the section for this tag from CHANGELOG.md so the draft
      # release body is populated automatically. Runs on every matrix
      # job; softprops tolerates the repeat and keeps the body stable.
      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ -f CHANGELOG.md ]]; then
            awk -v tag="$TAG" '
              /^## \[/ {
                if (section) exit
                if ($0 ~ ("\\[" tag "\\]")) { section = 1; print; next }
              }
              section { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if [[ ! -s release-notes.md ]]; then
            echo "_Release notes for $TAG were not found in CHANGELOG.md — falling back to auto-generated notes._" > release-notes.md
          fi
          cat >> release-notes.md <<'EOF'

          Portable archives contain the main executable and hook sidecar. Verify the
          matching `.zip.sha256` before unpacking. These CI artifacts are unsigned;
          Windows SmartScreen may show a warning. Review the publisher and file hash
          before deciding whether to run the program. Clean Windows 11 installation
          and sidecar behavior must be checked before this draft is published.
          EOF

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lobster-pulse-${{ github.ref_name }}-${{ matrix.name }}.zip
            lobster-pulse-${{ github.ref_name }}-${{ matrix.name }}.zip.sha256
          draft: true
          body_path: release-notes.md
