name: Build

# Cross-platform build check. Catches compile errors on all three OSes
# without needing Mac/Windows machines locally.
#
# Runs on:
#   - push to main
#   - pull requests to main
#   - manual dispatch (Actions tab → Run workflow)
#
# Produces build artifacts (binary only, no installer bundles) for download.
# For a full release with installers, see release.yml (tag-triggered).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ui-smoke:
    name: Browser UI contracts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and system dependencies
        run: npm exec --yes --package playwright -- playwright install --with-deps chromium
      - name: Verify all browser UI scenarios
        run: npm run test:ui-no-fake-data

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux
          - platform: macos-latest
            name: macos
          - platform: windows-latest
            name: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Test installation documentation and version guards
        if: matrix.platform == 'ubuntu-22.04'
        run: node --test test/version-consistency.test.js test/installation-docs.test.js

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall -y tauri-cli@^2.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate provider capability and K0 receipts
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          python -m pip install pytest
          python scripts/k0_target_baseline_check.py
          python -m pytest -q scripts/test_k0_measure.py scripts/test_k0_target_baseline_check.py
          node scripts/provider_inventory_guard.mjs
          node --test scripts/test_provider_coverage.mjs

      - name: Check counter migration contract
        run: |
          python scripts/check_counter_migration.py
          python -m unittest scripts/test_check_counter_migration.py

      - name: Test hooks configuration
        run: cargo test --manifest-path src-tauri/Cargo.toml hooks_configurator

      - name: Test postponed counter migration
        run: cargo test --manifest-path src-tauri/Cargo.toml postponed_counter_migration

      - name: Build (no bundle)
        run: cargo tauri build --no-bundle

      - name: Packaged Codex runtime smoke
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt install -y xvfb dbus-x11
          test/codex-runtime-smoke.sh --skip-build

      - name: Packaged counter migration and Prometheus smoke
        if: matrix.platform == 'ubuntu-22.04'
        run: bash test/counter-migration-runtime-smoke.sh

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: lobster-pulse-${{ matrix.name }}
          path: |
            src-tauri/target/release/lobster-pulse
            src-tauri/target/release/lobster-pulse.exe
            src-tauri/target/release/lobster-pulse-hook
            src-tauri/target/release/lobster-pulse-hook.exe
          if-no-files-found: ignore
          retention-days: 7
