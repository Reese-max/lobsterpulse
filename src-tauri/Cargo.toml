[package]
name = "lobster-pulse"
version = "0.5.4"
description = "Traditional Chinese desktop monitor for Claude, Codex, Copilot, and Gemini sessions"
authors = ["yazelin"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.10.3", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["net", "io-util", "rt", "sync", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
rodio = { version = "0.20", default-features = false, features = ["mp3", "wav", "vorbis"] }
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", features = ["trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry-semantic-conventions = "0.31"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gdk = "0.18"
gtk = "0.18"

[dev-dependencies]
opentelemetry_sdk = { version = "0.31", features = ["trace", "testing"] }
